plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' // Updated stable version string
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// FIX: NeoForge 1.21.1 requires Java 21 toolchains
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = "21.1.121"

    parchment {
        minecraftVersion = "1.21"
        mappingsVersion = "2024.07.28" // Omit any trailing "-1.21" tag suffixes
    }

    runs {
        client {
            client()

            systemProperties = [
                    'neoforge.logging.markers': 'REGISTRIES',
                    'neoforge.logging.console.level': 'debug'
            ]
        }
        server {
            server()
            // FIX: Explicitly declared as 'programArguments' array list
            programArguments = ['--nogui']
        }
        data {
            data()
            // FIX: Explicitly declared as 'programArguments' array list
            programArguments = [
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            ]
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // NeoForge's explicit library channels are managed automatically by the plugin
}

dependencies {
    // 1. Compile and run against JLayer
    implementation 'javazoom:jlayer:1.0.1'

    // 2. Instruct NeoForge to bundle it in your mod JAR
    jarJar(group: 'javazoom', name: 'jlayer', version: '1.0.1')
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version    : "1.21.1",
            loader_version_range : "[21.1,)",
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]

    inputs.properties replaceProperties

    // Expand ONLY the TOML file
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
